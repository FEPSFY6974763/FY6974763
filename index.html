<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      .button {
        border: solid;
        color: black;
        padding: 25px, 25px;
        text-align: centre;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>Enter some text below</h2>
    <input type="text" id="myInput" placeholder="Type here..">
    <button onclick="showText()">Click me!!!</button>

    <!Script>
    <script>
      function showText() {
        let userText = document.getElementById("myInput").value;
        alert(userText);
      }
    </script>
  </body>
</html>
