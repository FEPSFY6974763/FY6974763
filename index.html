<!DOCTYPE html>
<html>
  <head>
    
    <title>2023 City Population</title>
     <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  
  </head>

  <body>

    <!--bar chart display-->
    <div id="bar_div" style="width: 900px; height: 600px;"></div>
    
    <!--bar chart script-->
    <script>
    google.charts.load('current', {
        packages: ['corechart']
    });

    google.charts.setOnLoadCallback(drawCharts);
      function drawCharts() {
        try {
          drawBar();
        
      } catch (error) {
            console.error("Chart Error", error);
          }
      }

      function drawBar() {
      var data = google.visualization.arrayToDataTable([
        ['City', 'London', 'Birmingham', 'Edinburgh'],
        ['London', 9648000, null, null],
        ['Birmingham', null, 1153900, null],
        ['Edinburgh', null, null, 554000]
        
      ]);

        var options = {
            title: 'City Population in 2023',
            legend: { position: 'right' },
          isStacked: true,
          colors:['red','green','blue'],
          hAxis: {
            title: 'Population',
          }
          
        };

        var chart = new google.visualization.BarChart(
            document.getElementById('bar_div')
        );

        chart.draw(data, options);
    }
    </script>
    
                                                       
  </body>
</html>
